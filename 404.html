<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Page not found</title>
    <meta name="description" content="Page not found — ATOCODE">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      *{box-sizing:border-box}html{height:100%}
      body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:#f4f4f5;font-family:Inter,system-ui,sans-serif;line-height:1.6}
      .wrap{text-align:center;padding:40px 20px}
      h1{font-size:6rem;font-weight:900;margin:0;line-height:1;background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
      h2{font-size:1.5rem;font-weight:700;margin:12px 0;color:#f4f4f5}
      p{color:#a1a1aa;margin:0 0 28px;max-width:400px;margin-inline:auto}
      a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#f59e0b;color:#000;font-weight:600;border-radius:10px;transition:all 200ms ease}
      a:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,158,11,0.35)}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
